name: v58 materialize images
on:
  push:
    branches: [v58-deploy]
jobs:
  materialize:
    if: github.ref == 'refs/heads/v58-deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v58-deploy
      - name: Decode images, remove probes and this workflow
        run: |
          set -euo pipefail
          if [ ! -d .v58-payload ]; then
            echo "No payload; nothing to do"
            exit 0
          fi
          python3 <<'PY'
          import base64
          from pathlib import Path

          mapping = {
              Path('.v58-payload/cv-read-by-the-dead.webp.b64'): Path('images/albums/cv-read-by-the-dead.webp'),
              Path('.v58-payload/read-by-the-dead-phone.webp.b64'): Path('images/albums/read-by-the-dead-phone.webp'),
              Path('.v58-payload/read-by-the-dead.jpg.b64'): Path('images/albums/read-by-the-dead.jpg'),
              Path('.v58-payload/19-canvas-read-by-the-dead.jpg.b64'): Path('images/gallery/19-canvas-read-by-the-dead.jpg'),
              Path('.v58-payload/hall-read-by-the-dead.jpg.b64'): Path('images/hall/read-by-the-dead.jpg'),
          }
          for src, dest in mapping.items():
              if not src.is_file():
                  raise SystemExit(f'missing {src}')
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(base64.b64decode(src.read_text().strip()))
              print('wrote', dest, dest.stat().st_size)
          PY
          rm -rf .v58-payload .github
          rm -f .v58-bin-probe .v58-bin-probe-b64
          git config user.name "porcelainballerina"
          git config user.email "99560512+porcelainballerina@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "v58 part 7/7: Read by the Dead images and cleanup [skip ci]"
          git push origin v58-deploy
