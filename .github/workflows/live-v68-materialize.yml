name: Materialize live v68 lyrics removal and Danger Close
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.live-v68-payload/**'
jobs:
  materialize:
    if: github.repository == 'porcelainballerina/porcelainballerina-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack payload onto main
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, base64, tarfile, hashlib, io, os
          from pathlib import Path

          payload = Path('.live-v68-payload')
          man = json.loads((payload / 'manifest.json').read_text())
          allowed = set(man['files'])
          to_delete = set(man.get('delete') or [])
          forbidden = {
              'CNAME', 'robots.txt', 'sealed-room.html', 'warn-gate.js',
              'js/warn-gate.js', 'sw.js',
              '.github/workflows/live-v68-materialize.yml',
          }
          parts = [payload / name for name in man['parts']]
          if not parts or any(not p.is_file() for p in parts):
              raise SystemExit('missing archive parts')
          blob = b''.join(base64.b64decode(p.read_text().strip()) for p in parts)
          digest = hashlib.sha256(blob).hexdigest()
          if digest != man['tar_sha256']:
              raise SystemExit(f'tar sha mismatch {digest}')
          print('rebuilt tar.gz', len(blob), 'sha', digest)
          extracted = {}
          with tarfile.open(fileobj=io.BytesIO(blob), mode='r:gz') as tar:
              for m in tar.getmembers():
                  name = m.name.lstrip('./')
                  if not m.isfile():
                      continue
                  if name in forbidden or name.startswith('.github/') or '..' in name or name.startswith('/'):
                      raise SystemExit(f'refused path {name}')
                  if name not in allowed:
                      raise SystemExit(f'path not in manifest {name}')
                  f = tar.extractfile(m)
                  extracted[name] = f.read()
          missing = allowed - set(extracted)
          if missing:
              raise SystemExit('missing from tar: ' + ', '.join(sorted(missing)[:20]))
          if 'CNAME' in extracted or 'sealed-room.html' in extracted:
              raise SystemExit('refusing identity/room files')
          for name in to_delete:
              if name in forbidden or name.startswith('.github/') or '..' in name or name.startswith('/'):
                  raise SystemExit(f'refused delete path {name}')
              p = Path(name)
              if p.is_file():
                  p.unlink()
                  print('deleted', name)
          for name, data in extracted.items():
              dest = Path(name)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              print('wrote', name, len(data))
          print('ok: unpacked', len(extracted), 'files, deleted', len(to_delete))
          PY
          rm -rf .live-v68-payload .github/workflows/live-v68-materialize.yml
          if [ ! -f CNAME ]; then
            echo "REFUSING: CNAME missing after unpack" >&2
            exit 2
          fi
          if grep -qx 'porcelainballerina.com' CNAME; then
            :
          else
            echo "REFUSING: CNAME content changed" >&2
            cat CNAME >&2
            exit 2
          fi
          if [ -e sealed-room.html ]; then
            echo "REFUSING: sealed-room.html present" >&2
            exit 2
          fi
          test -f js/warn-gate.js
          grep -q 'pb-warned' index.html
          grep -q 'goatcounter' index.html
          grep -q 'home-rites' index.html
          grep -q 'Coming rites' index.html
          if grep -q 'data-oracle' index.html; then
            echo "REFUSING: homepage oracle still present" >&2
            exit 2
          fi
          test -f songs/what-the-fire-kept/01-triumpe.html
          if grep -E 'lyr-sheet|Lyrics and translation|Lyrics to come|English diary translation' songs/what-the-fire-kept/01-triumpe.html; then
            echo "REFUSING: lyric sheet still on Triumpe" >&2
            exit 2
          fi
          grep -q 'Listen on Suno' songs/what-the-fire-kept/01-triumpe.html
          grep -q 'song-nav' songs/what-the-fire-kept/01-triumpe.html
          if grep -q 'ac-line' albums/what-the-fire-kept.html albums.html; then
            echo "REFUSING: album-card lyric quotes still present" >&2
            exit 2
          fi
          test -f albums/danger-close.html
          test -f songs/danger-close/01-vigil.html
          test -f images/albums/danger-close.jpg
          test -f images/albums/cv-danger-close.webp
          test -f images/albums/danger-close-phone.webp
          test -f images/hall/danger-close.jpg
          test -f images/share/album--danger-close-d33ced7d56.jpg
          test -f images/share/danger-close--01-vigil-bd61488927.jpg
          python3 - <<'PY'
          from pathlib import Path
          import re
          idx = Path('index.html').read_text()
          arts = re.findall(r'<article class="rl-doc rl-suno-live.*?</article>', idx, re.S)
          if not arts or 'danger-close' not in arts[0] or 'Danger Close' not in arts[0]:
              raise SystemExit('REFUSING: Danger Close is not first in New on Suno')
          print('ok: Danger Close first in New on Suno')
          PY
          git config user.name "porcelainballerina"
          git config user.email "99560512+porcelainballerina@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "v68: remove song lyrics and translations, and add Danger Close" -m "Song pages keep the title, cover, listen links and album navigation. The homepage oracle, album-card quotes, Open Graph lyric lines and searchable lyric index are also removed. Danger Close is added as album 25 (11 songs, live on Suno 26 Nov 2026) and leads the New on Suno box. Album diary notes, greetings and the entry gate are unchanged."
          git push origin main
